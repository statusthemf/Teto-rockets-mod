name: Inspect Il2CppInterop Delegates

'on':
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run inspector
        run: dotnet run --project tools/Il2CppDelegateInspector/Il2CppDelegateInspector.csproj --configuration Release -- lib/Il2CppInterop.Runtime.dll lib/UnityEngine.CoreModule.dll
